<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thuan Kitchen — Góc Bếp Thông Minh &amp; Vòng Quay Món Ăn</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #26211d;
  --ink-soft: #6b6259;
  --paper: #f5f2ec;
  --surface: #ffffff;
  --surface-muted: #faf7f1;
  --charcoal: #241f1a;
  --charcoal-2: #332a22;
  --border: #e6ded0;
  --border-soft: #efe9dd;

  --marigold: #e2993c;
  --marigold-hover: #d38a35;
  --marigold-text: #9c5f1f;
  --herb: #4f7a4f;
  --herb-hover: #3c5f3c;
  --chili: #c1462f;
  --chili-hover: #a83a26;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-pill: 999px;

  --shadow-sm: 0 2px 6px rgba(36,32,27,.08);
  --shadow-md: 0 10px 26px rgba(36,32,27,.10);
  --shadow-lg: 0 26px 54px rgba(36,32,27,.20);

  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Fraunces', ui-serif, Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }
html { -webkit-tap-highlight-color: transparent; }
body {
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 60px;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
button { font-family: inherit; }
::selection { background: var(--marigold); color: var(--ink); }
:focus-visible { outline: 2.5px solid var(--marigold-text); outline-offset: 2px; border-radius: 4px; }

/* ===== HEADER ===== */
header {
  background: linear-gradient(150deg, var(--charcoal), var(--charcoal-2));
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 18px rgba(0,0,0,0.18);
}
.nav-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.9rem 1.5rem;
  gap: 1rem;
  flex-wrap: wrap;
}
.logo {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.2px;
}
.logo i { color: var(--marigold); font-size: 1.1rem; }
.nav-tabs {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.08);
  padding: 5px;
  border-radius: var(--r-pill);
  border: 1px solid rgba(255,255,255,0.08);
}
.tab-btn {
  border: none;
  background: transparent;
  padding: 9px 18px;
  border-radius: var(--r-pill);
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.25s ease;
  color: rgba(255,255,255,0.65);
  display: flex;
  align-items: center;
  gap: 8px;
}
.tab-btn:hover { color: #fff; }
.tab-btn.active {
  background: var(--marigold);
  color: var(--ink);
  box-shadow: 0 4px 14px rgba(226,153,60,0.4);
}

/* ===== LAYOUT ===== */
.container { max-width: 1200px; margin: 2rem auto; padding: 0 1.25rem; }
.tab-content { display: none; animation: fadeIn 0.35s ease-out; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.chef-grid { display: grid; grid-template-columns: 360px 1fr; gap: 1.5rem; align-items: start; }
@media (max-width: 900px) { .chef-grid { grid-template-columns: 1fr; } }

/* ===== CARD ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: 1.4rem;
  box-shadow: var(--shadow-sm);
  margin-bottom: 1.5rem;
}
.card-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.08rem;
  margin-bottom: 1.1rem;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.title-group { display: inline-flex; align-items: center; gap: 8px; }
.icon-badge {
  width: 30px; height: 30px; min-width: 30px;
  border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.85rem; color: #fff; background: var(--marigold);
}
.icon-badge.herb { background: var(--herb); }
.icon-badge.chili { background: var(--chili); }

/* ===== INPUTS ===== */
.input-label {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.hint { font-size: 0.76rem; color: var(--ink-soft); margin: -4px 0 0.7rem; display: flex; align-items: center; gap: 5px; }
.ingredient-input-group { display: flex; gap: 8px; margin-bottom: 0.5rem; }
input[type="text"], textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  outline: none;
  transition: 0.2s;
  font-size: 0.9rem;
  background: var(--surface-muted);
  color: var(--ink);
}
input[type="text"]:focus, textarea:focus {
  border-color: var(--marigold);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(226,153,60,0.18);
}
textarea { resize: vertical; line-height: 1.55; }
input[type="file"] { font-size: 0.85rem; color: var(--ink-soft); }
input[type="file"]::file-selector-button {
  font-family: inherit;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--ink);
  background: var(--marigold);
  border: none;
  padding: 8px 14px;
  border-radius: var(--r-sm);
  cursor: pointer;
  margin-right: 10px;
  transition: 0.2s;
}
input[type="file"]::file-selector-button:hover { background: var(--marigold-hover); }

/* ===== BUTTONS ===== */
.btn {
  padding: 10px 18px;
  border: none;
  border-radius: var(--r-sm);
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  transition: 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--marigold); color: var(--ink); }
.btn-primary:hover { background: var(--marigold-hover); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(226,153,60,0.35); }
.btn-secondary { background: var(--herb); color: #fff; }
.btn-secondary:hover { background: var(--herb-hover); transform: translateY(-1px); box-shadow: 0 8px 18px rgba(79,122,79,0.3); }
.btn-danger { background: var(--chili); color: #fff; }
.btn-danger:hover { background: var(--chili-hover); }
.btn-icon { padding: 10px 13px; }

/* ===== TAGS ===== */
.tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; min-height: 30px; }
.tag {
  padding: 5px 10px;
  border-radius: var(--r-pill);
  font-size: 0.8rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  animation: pop 0.2s ease;
}
@keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.tag-main { background: #fbe6c4; color: var(--marigold-text); }
.tag-sub { background: #e2ecdf; color: var(--herb-hover); }
.tag i { cursor: pointer; transition: 0.15s; }
.tag i:hover { color: var(--chili); transform: scale(1.15); }

/* ===== RECIPE CARDS ===== */
.recipe-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; }
.recipe-card {
  background: var(--surface);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.25s, box-shadow 0.25s;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border-soft);
}
.recipe-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.recipe-img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  background: linear-gradient(135deg, #f3e2c2, #dfeadb);
  display: block;
  border-bottom: 3px solid var(--marigold);
}
.recipe-body { padding: 1rem 1.1rem; flex: 1; display: flex; flex-direction: column; gap: 0.6rem; }
.recipe-title { font-family: var(--font-display); font-size: 1.12rem; font-weight: 600; line-height: 1.3; }
.recipe-ingredients {
  font-size: 0.82rem;
  color: var(--ink-soft);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.recipe-actions { margin-top: auto; display: flex; gap: 8px; }
.recipe-actions .btn { padding: 7px 12px; font-size: 0.78rem; }

/* ===== WHEEL ===== */
.wheel-container { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 1.5rem; align-items: start; }
@media (max-width: 900px) { .wheel-container { grid-template-columns: 1fr; } }
.wheel-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1.4rem 2.2rem;
  background: linear-gradient(165deg, var(--charcoal), var(--charcoal-2));
  border: none;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
}
.wheel-stage { position: relative; width: 100%; max-width: 440px; display: flex; justify-content: center; }
#wheelCanvas {
  border-radius: 50%;
  box-shadow: 0 16px 36px rgba(0,0,0,0.4);
  background: #fff;
  display: block;
  max-width: 100%;
}
.pointer {
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 30px solid var(--marigold);
  z-index: 10;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45));
  pointer-events: none;
}
.spin-btn {
  margin-top: 1.8rem;
  padding: 15px 44px;
  font-size: 1.05rem;
  border-radius: var(--r-pill);
  box-shadow: 0 10px 26px rgba(226,153,60,0.45);
  letter-spacing: 0.3px;
}
.spin-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

.checklist-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  transition: 0.18s;
  cursor: pointer;
}
.checklist-item:hover { background: var(--surface-muted); border-color: var(--border); }
.checklist-item.checked { background: #fdf0dc; border-color: #f2d29b; }
.checklist-item label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.92rem; font-weight: 500; width: 100%; }
.checklist-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--marigold-text); cursor: pointer; flex-shrink: 0; }
.wheel-checklist { max-height: 380px; overflow-y: auto; padding-right: 4px; }
.wheel-checklist::-webkit-scrollbar { width: 6px; }
.wheel-checklist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

#recipeContainer p, #wheelItemsList p {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--ink-soft) !important;
  padding: 2.4rem 1rem !important;
  border: 1.5px dashed var(--border);
  border-radius: var(--r-md);
  font-size: 0.9rem;
}

/* ===== MODAL ===== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(20, 17, 13, 0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(3px);
  padding: 1rem;
  animation: fadeIn 0.2s ease;
}
.modal.active { display: flex; }
.modal-content {
  background: var(--surface);
  padding: 2rem;
  border-radius: var(--r-lg);
  max-width: 550px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 30px 64px rgba(0,0,0,0.3);
  position: relative;
  animation: slideUp 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  outline: none;
}
@keyframes slideUp { from { transform: translateY(20px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-content::-webkit-scrollbar { width: 8px; }
.modal-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
.modal-content h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; margin-bottom: 1.1rem; }
.close-btn {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 1.6rem;
  line-height: 1;
  cursor: pointer;
  color: var(--ink-soft);
  background: none;
  border: none;
  padding: 4px;
  transition: 0.15s;
}
.close-btn:hover { color: var(--chili); transform: rotate(90deg); }

.image-preview { width: 100%; height: 160px; border-radius: var(--r-sm); object-fit: cover; margin-top: 10px; display: none; border: 1px solid var(--border); }
.form-group { margin-bottom: 1.1rem; }
.form-group label { font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 6px; }

/* ===== WINNER ===== */
.winner-card { text-align: center; }
.winner-card h2 { color: var(--marigold-text); font-weight: 700; font-size: 1.05rem; margin-bottom: 0.3rem; letter-spacing: 0.2px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.winner-card h1 {
  font-family: var(--font-display);
  margin: 0.3rem 0 1rem;
  color: var(--ink);
  font-size: 1.9rem;
  font-weight: 600;
  animation: winnerPop 0.5s ease 0.05s both;
}
.winner-card img { width: 100%; max-height: 240px; object-fit: cover; border-radius: var(--r-md); margin: 0.5rem 0 1rem; box-shadow: var(--shadow-md); animation: winnerPop 0.5s ease 0.15s both; }
@keyframes winnerPop { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
.steps-box {
  text-align: left;
  background: var(--surface-muted);
  padding: 14px;
  border-radius: var(--r-sm);
  margin-top: 10px;
  font-size: 0.88rem;
  line-height: 1.65;
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--border-soft);
}
.steps-box::-webkit-scrollbar { width: 6px; }
.steps-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
.ing-box { text-align: left; font-size: 0.88rem; line-height: 1.6; color: var(--ink-soft); }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%) translateY(100px);
  background: var(--charcoal);
  color: #fff;
  padding: 12px 22px;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  box-shadow: 0 14px 34px rgba(0,0,0,0.35);
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.25s;
  max-width: min(90vw, 480px);
  text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { background: linear-gradient(135deg, var(--herb), var(--herb-hover)); }
.toast.warning { background: linear-gradient(135deg, var(--marigold), var(--marigold-hover)); color: var(--ink); }
.toast.error { background: linear-gradient(135deg, var(--chili), var(--chili-hover)); }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .nav-container { padding: 0.8rem 1rem; }
  .logo { font-size: 1.2rem; }
  .tab-btn { padding: 8px 12px; font-size: 0.82rem; }
  .container { padding: 0 0.75rem; margin: 1.2rem auto; }
  .card { padding: 1.1rem; }
  .modal-content { padding: 1.4rem; }
  .recipe-actions { flex-wrap: wrap; }
  .spin-btn { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<header>
  <div class="nav-container">
    <div class="logo">
      <i class="fa-solid fa-kitchen-set"></i> Thuan Kitchen
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="chef">
        <i class="fa-solid fa-utensils"></i> Đầu Bếp
      </button>
      <button class="tab-btn" data-tab="wheel">
        <i class="fa-solid fa-dharmachakra"></i> Vòng Quay
      </button>
    </div>
  </div>
</header>

<div class="container">
  <!-- ============ TAB 1: ĐẦU BẾP ============ -->
  <div id="chef-tab" class="tab-content active">
    <div class="chef-grid">
      <div>
        <div class="card">
          <div class="card-title">
            <span class="icon-badge"><i class="fa-solid fa-basket-shopping"></i></span>
            Tủ Lạnh Hôm Nay Có Gì?
          </div>

          <div class="input-label">
            <i class="fa-solid fa-drumstick-bite" style="color: var(--chili);"></i>
            Nguyên Liệu Chính (Thịt, cá, hải sản...)
          </div>
          <div class="ingredient-input-group">
            <input type="text" id="mainIngInput" placeholder="VD: Cá, Thịt bò, Gà...">
            <button class="btn btn-primary btn-icon" id="addMainBtn" title="Thêm">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
          <div class="tags-container" id="mainIngredientsList"></div>

          <div class="input-label">
            <i class="fa-solid fa-carrot" style="color: var(--herb);"></i>
            Món Phụ / Rau Củ (Rau, cà chua, cần tây...)
          </div>
          <div class="ingredient-input-group">
            <input type="text" id="subIngInput" placeholder="VD: Cà chua, Cần tây, Bí đỏ...">
            <button class="btn btn-secondary btn-icon" id="addSubBtn" title="Thêm">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
          <div class="tags-container" id="subIngredientsList"></div>
          <p class="hint"><i class="fa-solid fa-circle-info"></i> Nhấn Enter hoặc dấu phẩy để thêm nhanh.</p>

          <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="generateBtn">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Gợi Ý Món Kết Hợp
          </button>
        </div>

        <div class="card">
          <button class="btn btn-secondary" style="width: 100%;" id="newRecipeBtn">
            <i class="fa-solid fa-pen-to-square"></i> Tự Thêm Công Thức Mới
          </button>
        </div>
      </div>

      <div>
        <div class="card-title" style="justify-content: space-between;">
          <span class="title-group">
            <span class="icon-badge herb"><i class="fa-solid fa-book-bookmark"></i></span>
            Sổ Tay Món Ăn (<span id="recipeCount">0</span>)
          </span>
          <button class="btn btn-secondary" style="padding: 5px 12px; font-size: 0.8rem;" id="resetFilterBtn">
            Hiện Tất Cả
          </button>
        </div>
        <div class="recipe-list" id="recipeContainer"></div>
      </div>
    </div>
  </div>

  <!-- ============ TAB 2: VÒNG QUAY ============ -->
  <div id="wheel-tab" class="tab-content">
    <div class="wheel-container">
      <div class="card wheel-wrapper">
        <div class="wheel-stage">
          <div class="pointer"></div>
          <canvas id="wheelCanvas" width="400" height="400"></canvas>
        </div>
        <button class="btn btn-primary spin-btn" id="spinBtn">
          <i class="fa-solid fa-play"></i> QUAY NGAY
        </button>
      </div>

      <div class="card">
        <div class="card-title">
          <span class="icon-badge chili"><i class="fa-solid fa-list-check"></i></span>
          Món Ăn Tham Gia Quay
        </div>
        <p style="font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 1rem;">
          Tích chọn ít nhất 2 món để đưa vào vòng quay:
        </p>
        <div id="wheelItemsList" class="wheel-checklist"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODAL: RECIPE ============ -->
<div class="modal" id="recipeModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content" tabindex="-1">
    <button class="close-btn" data-close="recipeModal" aria-label="Đóng">&times;</button>
    <h3 id="modalTitle">Thêm / Chỉnh Sửa Công Thức</h3>
    <form id="recipeForm">
      <input type="hidden" id="editRecipeId">

      <div class="form-group">
        <label>Tên món ăn</label>
        <input type="text" id="recipeName" required placeholder="VD: Canh chua cá">
      </div>

      <div class="form-group">
        <label>Nguyên liệu chính & phụ</label>
        <textarea id="recipeIngs" rows="4" required placeholder="500g cá lóc&#10;2 quả cà chua&#10;Hành, tỏi, gia vị"></textarea>
      </div>

      <div class="form-group">
        <label>Các bước chế biến</label>

<script>
/* ============================================================
   0) TIỆN ÍCH
   ============================================================ */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

// Escape HTML chống XSS
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// [P3] Unique ID — tránh trùng khi tạo 2 recipe cùng millisecond
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// Toast thay cho alert()
let _toastTimer;
function toast(msg, type = 'success') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// Nén ảnh trước khi lưu
function compressImage(file, maxSize = 720, quality = 0.78) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('not-image'));
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxSize / Math.max(width, height));
        width  = Math.max(1, Math.round(width  * scale));
        height = Math.max(1, Math.round(height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        try {
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error('decode-fail'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('read-fail'));
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   2) STATE + PERSISTENCE
   ============================================================ */
const STORAGE_RECIPES = 'myRecipes_v6';
const STORAGE_WHEEL   = 'selectedWheel_v6';

let recipes = [];
let filteredRecipes = null;
let selectedWheelIds = [];
let mainIngredients = [];
let subIngredients = [];
let base64TmpImage = '';

function persistRecipes() {
  try {
    localStorage.setItem(STORAGE_RECIPES, JSON.stringify(recipes));
    return true;
  } catch (e) {
    toast('⚠️ Bộ nhớ đã đầy! Hãy xoá bớt ảnh hoặc công thức cũ.', 'error');
    return false;
  }
}

function persistWheelSelection() {
  try {
    localStorage.setItem(STORAGE_WHEEL, JSON.stringify(selectedWheelIds));
  } catch (e) { /* silent */ }
}

/* [P2] Commit wrapper có rollback — dùng cho mọi thao tác mutate recipes */
function commitRecipes(mutator) {
  const backupRecipes  = recipes.slice();
  const backupFiltered = filteredRecipes;
  const backupWheel    = selectedWheelIds.slice();
  try {
    mutator();
    if (!persistRecipes()) throw new Error('persist-fail');
    return true;
  } catch (err) {
    recipes           = backupRecipes;
    filteredRecipes   = backupFiltered;
    selectedWheelIds  = backupWheel;
    renderRecipeCards();
    renderWheelChecklist();
    drawWheel();
    toast('Không lưu được — đã khôi phục dữ liệu cũ.', 'error');
    return false;
  }
}

function initData() {
  try {
    const raw = localStorage.getItem(STORAGE_RECIPES);
    const parsed = raw ? JSON.parse(raw) : null;
    recipes = Array.isArray(parsed) && parsed.length ? parsed : JSON.parse(JSON.stringify(chefDatabase));
  } catch (e) {
    recipes = JSON.parse(JSON.stringify(chefDatabase));
  }

  try {
    selectedWheelIds = JSON.parse(localStorage.getItem(STORAGE_WHEEL) || '[]');
    if (!Array.isArray(selectedWheelIds)) selectedWheelIds = [];
  } catch (e) { selectedWheelIds = []; }

  sanitizeSelection();
  renderRecipeCards();
}

function sanitizeSelection() {
  const validIds = new Set(recipes.map(r => r.id));
  const before = selectedWheelIds.length;
  selectedWheelIds = selectedWheelIds.filter(id => validIds.has(id));
  if (before !== selectedWheelIds.length) persistWheelSelection();
}

$('#generateBtn').addEventListener('click', generateRecipes);

function generateRecipes() {
  if (mainIngredients.length === 0 && subIngredients.length === 0) {
    toast('Vui lòng nhập ít nhất 1 nguyên liệu!', 'warning');
    return;
  }

  const results = [];
  recipes.forEach(r => {
    const text = (r.title + ' ' + (r.keywords ? r.keywords.join(' ') : '') + ' ' + (r.ingredients || '')).toLowerCase();
    const mainMatched = mainIngredients.some(m => text.includes(m));
    const subMatched  = subIngredients.some(s => text.includes(s));

    if (mainIngredients.length > 0 && subIngredients.length > 0) {
      if (mainMatched && subMatched) results.push(r);
    } else if (mainIngredients.length > 0) {
      if (mainMatched) results.push(r);
    } else {
      if (subMatched) results.push(r);
    }
  });

  if (results.length > 0) {
    filteredRecipes = results;
    renderRecipeCards();
    toast(`Đã tìm thấy ${results.length} món phù hợp! 🍽️`);
    return;
  }

  // Không có → tự tạo
  const mainStr = mainIngredients.join(', ');
  const subStr  = subIngredients.join(', ');
  const newTitle = generateDishTitle(mainIngredients, subIngredients);

  const autoRecipe = {
    id: uid(),
    title: newTitle,
    keywords: [...mainIngredients, ...subIngredients],
    ingredients: `• Nguyên liệu chính: ${mainStr || '(không có)'}\n• Nguyên liệu phụ: ${subStr || '(không có)'}\n• Gia vị: Tỏi, hành, hạt nêm, nước mắm, tiêu, dầu ăn`,
    steps: `1. Sơ chế làm sạch ${mainStr || 'nguyên liệu chính'} và cắt nhỏ ${subStr || 'rau củ'}.\n2. Phi thơm hành tỏi với dầu ăn trên chảo nóng.\n3. Cho ${mainStr || 'nguyên liệu chính'} vào xào săn, sau đó cho ${subStr || 'rau củ'} vào đảo đều lửa lớn.\n4. Nêm nếm gia vị vừa ăn, tắt bếp và trình bày ra đĩa.`,
    image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'
  };

  const ok = commitRecipes(() => {
    recipes.unshift(autoRecipe);
    filteredRecipes = [autoRecipe];
  });

  if (ok) {
    renderRecipeCards();
    toast(`Đã tạo món mới: "${newTitle}" và lưu vào sổ tay! ✨`);
  }
}

function generateDishTitle(mains, subs) {
  const mainText = mains.map(capitalizeFirstLetter).join(' ');
  const subText  = subs.map(capitalizeFirstLetter).join(' ');
  if (mains.length > 0 && subs.length > 0) return `${mainText} xào ${subText}`;
  if (mains.length > 0) return `${mainText} xào tỏi / nấu canh`;
  return `Rau củ xào ${subText}`;
}
function capitalizeFirstLetter(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

$('#recipeContainer').addEventListener('click', e => {

  if (!btn) return;
  const card = btn.closest('[data-recipe-id]');
  const id = card.dataset.recipeId;
  const action = btn.dataset.action;
  if (action === 'edit') openEditModal(id);
  if (action === 'delete') deleteRecipe(id);
});

function deleteRecipe(id) {
  if (!confirm('Bạn có chắc muốn xoá món ăn này?')) return;

  const ok = commitRecipes(() => {
    recipes = recipes.filter(r => r.id !== id);
    if (filteredRecipes) filteredRecipes = filteredRecipes.filter(r => r.id !== id);
    selectedWheelIds = selectedWheelIds.filter(wId => wId !== id);
    persistWheelSelection();
  });

  if (ok) {
    renderRecipeCards();
    renderWheelChecklist();
    drawWheel();
    toast('Đã xoá món ăn.');
  }
}

let _lastFocused = null;

function _getFocusable(container) {
  return Array.from(container.querySelectorAll(
    'a[href],button:not([disabled]),textarea:not([disabled]),' +
    'input:not([disabled]):not([type="hidden"]),select:not([disabled]),' +
    '[tabindex]:not([tabindex="-1"])'
  )).filter(el => el.offsetParent !== null);
}

function openEditModal(id = null) {
  _lastFocused = document.activeElement;
  const modal = $('#recipeModal');
  const imgPreview = $('#imgPreview');
  const removeImgBtn = $('#removeImgBtn');
  base64TmpImage = '';

  if (id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;
    $('#modalTitle').textContent = 'Chỉnh Sửa Công Thức';
    $('#editRecipeId').value = recipe.id;
    $('#recipeName').value = recipe.title;
    $('#recipeIngs').value = recipe.ingredients || '';
    $('#recipeSteps').value = recipe.steps || '';

    if (recipe.image) {
      imgPreview.src = recipe.image;
      imgPreview.style.display = 'block';
      removeImgBtn.style.display = 'inline-flex';
      base64TmpImage = recipe.image;
    } else {
      imgPreview.src = '';
      imgPreview.style.display = 'none';
      removeImgBtn.style.display = 'none';
    }
  } else {
    $('#modalTitle').textContent = 'Thêm Công Thức Mới';
    $('#recipeForm').reset();
    $('#editRecipeId').value = '';
    imgPreview.src = '';
    imgPreview.style.display = 'none';
    removeImgBtn.style.display = 'none';
  }

  $('#recipeImgInput').value = '';
  modal.classList.add('active');

  // Focus vào input đầu tiên
  requestAnimationFrame(() => {
    const box = modal.querySelector('.modal-content');
    const first = box && _getFocusable(box)[0];
    if (first) first.focus();
  });
}

function closeModal(modalId) {
  const m = document.getElementById(modalId);
  if (m) m.classList.remove('active');
  // Trả focus về nơi cũ
  if (_lastFocused && typeof _lastFocused.focus === 'function') {
    try { _lastFocused.focus({ preventScroll: true }); } catch(e){}
  }
  _lastFocused = null;
}

// Đóng modal: nút X, backdrop, ESC
$$('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
$$('.modal').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) closeModal(m.id);
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('.modal.active').forEach(m => closeModal(m.id));
});

// [P4] Focus trap — Tab xoay vòng trong modal
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const box = document.querySelector('.modal.active .modal-content');
  if (!box) return;
  const list = _getFocusable(box);
  if (!list.length) return;
  const first = list[0];
  const last  = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
});

/* ============================================================
   8) WHEEL
   ============================================================ */
const canvas = $('#wheelCanvas');
const ctx = canvas.getContext('2d');
let currentAngle = 0;
let isSpinning = false;
let canvasSize = 400;
let selectedWinner = null;
const colors = ['#ff6b6b', '#4ecdc4', '#ffeaa7', '#a29bfe', '#fd79a8', '#74b9ff', '#55efc4', '#fab1a0'];

// Canvas responsive + devicePixelRatio
function fitCanvas() {
  const stage = canvas.parentElement;
  if (!stage) return;
  const stageWidth = stage.clientWidth || 400;
  const size = Math.max(240, Math.min(440, stageWidth));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas._size === size && canvas._dpr === dpr) return;
  canvas._size = size;
  canvas._dpr = dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvasSize = size;
}

function getActiveWheelItems() {
  return recipes.filter(r => selectedWheelIds.includes(r.id));
}

function renderWheelChecklist() {
  const container = $('#wheelItemsList');
  if (recipes.length === 0) {
    container.innerHTML = '<p style="color:#636e72;">Chưa có món ăn nào trong Sổ Tay.</p>';
    updateSpinButton();
    return;
  }

  container.innerHTML = recipes.map(r => {
    const checked = selectedWheelIds.includes(r.id);
    return `
      <div class="checklist-item ${checked ? 'checked' : ''}" data-check-id="${esc(r.id)}">
        <label>
          <input type="checkbox" ${checked ? 'checked' : ''} data-toggle-id="${esc(r.id)}">
          ${esc(r.title)}
        </label>
      </div>
    `;
  }).join('');

  updateSpinButton();
}

/* [P1] Fix double-toggle: CHỈ lắng nghe 'change'.
   Browser tự fire change khi user click vào label HOẶC input.
   Không cần thêm listener 'click' thủ công → không bao giờ double. */
$('#wheelItemsList').addEventListener('change', e => {
  const cb = e.target.closest('input[type="checkbox"][data-toggle-id]');
  if (!cb) return;
  toggleWheelItem(cb.dataset.toggleId);
});

// Cho phép click vào padding của hàng (không phải label/input) cũng toggle
// → dùng cb.click() để browser tự fire change, KHÔNG tự toggle
$('#wheelItemsList').addEventListener('click', e => {
  if (e.target.closest('label, input')) return;
  const item = e.target.closest('.checklist-item');
  if (!item) return;
  const cb = item.querySelector('input[type="checkbox"]');
  if (cb && !cb.disabled) cb.click();
});

function toggleWheelItem(id) {
  const idx = selectedWheelIds.indexOf(id);
  if (idx > -1) selectedWheelIds.splice(idx, 1);
  else selectedWheelIds.push(id);
  persistWheelSelection();

  // Cập nhật cục bộ thay vì re-render cả list
  const row = document.querySelector(`.checklist-item[data-check-id="${CSS.escape(id)}"]`);
  if (row) {
    const checked = selectedWheelIds.includes(id);
    row.classList.toggle('checked', checked);
    const cb = row.querySelector('input[type="checkbox"]');
    if (cb) cb.checked = checked;
  }
  updateSpinButton();
  drawWheel();
}

function updateSpinButton() {
  const n = getActiveWheelItems().length;
  $('#spinBtn').disabled = n < 2 || isSpinning;
}

function drawWheel() {
  const items = getActiveWheelItems();
  const n = items.length;
  const size = canvasSize;
  const cx = size / 2;
  const cy = size / 2;
  const radius = size / 2 - 6;

  ctx.clearRect(0, 0, size, size);

  if (n === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
    ctx.fillStyle = '#eef1f4';
    ctx.fill();
    ctx.strokeStyle = '#dfe6e9';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#95a5a6';
    ctx.font = `600 ${Math.max(12, size * 0.035)}px 'Plus Jakarta Sans', system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Chọn món ở cột phải', cx, cy);
    return;
  }

  const arc = (Math.PI * 2) / n;

  for (let i = 0; i < n; i++) {
    const a0 = currentAngle + i * arc;
    const a1 = a0 + arc;
    const mid = a0 + arc / 2;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, a0, a1);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    const flipped = Math.cos(mid) < 0;
    if (flipped) ctx.rotate(Math.PI);
    ctx.fillStyle = '#2d3436';
    ctx.font = `700 ${Math.max(10, Math.min(15, 180 / n))}px 'Plus Jakarta Sans', system-ui, sans-serif`;
    ctx.textBaseline = 'middle';
    const maxChars = Math.max(8, Math.floor(18 - n / 3));
    let label = items[i].title;
    if (label.length > maxChars) label = label.slice(0, maxChars - 1) + '…';
    if (flipped) {
      ctx.textAlign = 'left';
      ctx.fillText(label, -radius * 0.82, 0);
    } else {
      ctx.textAlign = 'right';
      ctx.fillText(label, radius * 0.82, 0);
    }
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(14, size * 0.05), 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(45, 52, 54, 0.9)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

/* ---- SPIN (đã fix jump) ---- */
$('#spinBtn').addEventListener('click', spinWheel);

function spinWheel() {
  if (isSpinning) return;
  const items = getActiveWheelItems();
  if (items.length < 2) {
    toast('Cần ít nhất 2 món để quay!', 'warning');
    return;
  }
  isSpinning = true;
  updateSpinButton();

  const n = items.length;
  const arc = (Math.PI * 2) / n;

  // Chọn trước món thắng → đảm bảo kim chỉ đúng
  const winnerIdx = Math.floor(Math.random() * n);
  const jitter = (Math.random() - 0.5) * arc * 0.7;

  const targetAbsolute = -Math.PI / 2 - (winnerIdx + 0.5) * arc + jitter;

  // Cộng dồn từ currentAngle — không nhảy về 0
  const startAngle = currentAngle;
  let delta = targetAbsolute - startAngle;
  const minDelta = Math.PI * 2 * 5;
  while (delta < minDelta) delta += Math.PI * 2;

  const duration = 4200 + Math.random() * 900;
  const t0 = performance.now();

  function animate(t) {
    const p = Math.min((t - t0) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3.5);
    currentAngle = startAngle + delta * ease;
    drawWheel();
    if (p < 1) {
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      updateSpinButton();
      showWinner(items[winnerIdx]);
    }
  }
  requestAnimationFrame(animate);
}

/* ---- WINNER MODAL ---- */
function showWinner(dish) {
  _lastFocused = document.activeElement;
  selectedWinner = dish;
  $('#winnerTitle').textContent = dish.title;
  $('#winnerIngredients').innerHTML = `<strong>Nguyên liệu:</strong><br>${esc(dish.ingredients || '').replace(/\n/g, '<br>')}`;
  $('#winnerSteps').innerHTML = `<strong>Hướng dẫn nấu:</strong><br>${esc(dish.steps || '').replace(/\n/g, '<br>')}`;

  const img = $('#winnerImg');
  if (dish.image) {
    img.src = dish.image;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
    img.removeAttribute('src');
  }
  $('#winnerModal').classList.add('active');

  requestAnimationFrame(() => {
    const box = document.querySelector('#winnerModal .modal-content');
    const first = box && _getFocusable(box)[0];
    if (first) first.focus();
  });
}

$('#editWinnerBtn').addEventListener('click', () => {
  if (!selectedWinner) return;
  const idToEdit = selectedWinner.id;
  closeModal('winnerModal');
  switchTab('chef');
  setTimeout(() => openEditModal(idToEdit), 100);
});

$('#spinAgainBtn').addEventListener('click', () => {
  closeModal('winnerModal');
  setTimeout(spinWheel, 250);
});

/* ============================================================
   9) RESIZE OBSERVER
   ============================================================ */
let _rzTimer;
window.addEventListener('resize', () => {
  clearTimeout(_rzTimer);
  _rzTimer = setTimeout(() => {
    if ($('#wheel-tab').classList.contains('active')) {
      fitCanvas();
      drawWheel();
    }
  }, 120);
});

if (window.ResizeObserver) {
  new ResizeObserver(() => {
    if ($('#wheel-tab').classList.contains('active')) {
      const before = canvas._size;
      fitCanvas();
      if (canvas._size !== before) drawWheel();
    }
  }).observe(canvas.parentElement);
}

/* ============================================================
   10) KHỞI ĐỘNG
   ============================================================ */
renderMainIngredients();
renderSubIngredients();
initData();
renderWheelChecklist();
requestAnimationFrame(() => { fitCanvas(); drawWheel(); });
